test_medication_statement_group:
  # A medication obs group: parent 40 = "Current medication order" (1442) with children drug(1282),
  # strength(1444), duration(159368). It must become ONE MedicationStatement (keyed on the parent
  # obs_id); the members must NOT each become their own resource. A group parent with no drug member
  # (obs 50) must be dropped. (Resource JSON isn't asserted — MySQL reorders JSON keys — so the tests
  # assert scalar columns, same as the observation/immunization tests.)
  model: fhir.medication_statement
  inputs:
    consolidated_db.obs_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), concept_id: int, value_coded: int, value_numeric: double, value_text: varchar(255), obs_group_id: int, voided: int}
      rows: |
        obs_id,person_id,mspp_code,concept_id,obs_datetime,value_coded,value_numeric,value_text,obs_group_id,uuid,voided
        40,11,11106,1442,2026-01-06 09:00:00,,,,,1a1f0c1e-0000-4000-8000-000000000040,0
        41,11,11106,1282,2026-01-06 09:00:00,71589,,,40,2b2f0c1e-0000-4000-8000-000000000041,0
        42,11,11106,1444,2026-01-06 09:00:00,,,500 mg,40,3c3f0c1e-0000-4000-8000-000000000042,0
        43,11,11106,159368,2026-01-06 09:00:00,,30,,40,4d4f0c1e-0000-4000-8000-000000000043,0
        50,11,11106,1442,2026-02-01 08:00:00,,,,,5e5f0c1e-0000-4000-8000-000000000050,0
    consolidated_db.person_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), voided: int}
      rows: |
        person_id,mspp_code,uuid,voided
        11,11106,fe5cae86-52a1-4713-b39d-4c05a9da3abf,0
    consolidated_db.concept_name:
      format: csv
      columns: {concept_id: int, locale_preferred: int, voided: int}
      rows: |
        concept_name_id,concept_id,name,locale,locale_preferred,voided
        1,71589,ASCORBIC ACID,en,1,0
    consolidated_db.concept:
      format: csv
      columns: {concept_id: int, class_id: int}
      rows: |
        concept_id,uuid,class_id
        71589,9b3f0c1e-0000-4000-8000-000000071589,3
  outputs:
    query:
      partial: true
      rows:
        - {mspp_code: '11106', obs_id: 40, fhir_id: 1a1f0c1e-0000-4000-8000-000000000040, patient_fhir_id: fe5cae86-52a1-4713-b39d-4c05a9da3abf}
