test_observation_excludes_demographic:
  # A demographic concept (Civil status) present in the excluded-concepts seed must NOT be emitted
  # as an Observation: with only that obs as input, the model output is empty.
  model: fhir.observation
  inputs:
    consolidated_db.obs_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), concept_id: int, voided: int}
      rows: |
        obs_id,person_id,mspp_code,concept_id,encounter_id,obs_datetime,value_text,uuid,voided
        2,11,11106,1054,1,2026-01-02 09:05:00,Never married,aaaa7296-a108-4a76-a50c-22ccd87cc9bb,0
    consolidated_db.person_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), voided: int}
      rows: |
        person_id,mspp_code,uuid,voided
        11,11106,fe5cae86-52a1-4713-b39d-4c05a9da3abf,0
    consolidated_db.encounter_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), voided: int}
      rows: |
        encounter_id,patient_id,mspp_code,uuid,voided
        1,11,11106,2650d51a-31b4-451b-a5fb-eb6e1a8c7a07,0
    consolidated_db.concept_name:
      format: csv
      columns: {concept_id: int, locale_preferred: int, voided: int}
      rows: |
        concept_name_id,concept_id,name,locale_preferred,concept_name_type,voided
        2,1054,Civil status,1,FULLY_SPECIFIED,0
    consolidated_db.concept:
      format: csv
      columns: {concept_id: int, class_id: int}
      rows: |
        concept_id,uuid,class_id
        1054,1054AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA,7
    fhir.excluded_obs_concepts:
      format: csv
      columns: {uuid: text, name: text}
      rows: |
        uuid,name
        1054AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA,Civil status
  outputs:
    query:
      rows: []
