test_condition_simple:
  # A diagnosis becomes a FHIR Condition, read from `diagnosis` — `patient_diagnosis` is in the schema
  # but no site sends it. No encounter reference is emitted (the fhir2 runtime doesn't set
  # Condition.encounter and the IG omrs-Condition profile prohibits it). The resource JSON isn't
  # asserted here: MySQL reorders JSON object keys, so the engine compares the blob as an opaque string.
  model: fhir.condition
  inputs:
    consolidated_db.diagnosis:
      format: csv
      columns: {mspp_code: varchar(10), patient_id: int, encounter_id: int, location_id: int, code: int, group_id: int, name: varchar(255), nature: varchar(50), position: varchar(50), certainty: varchar(50), voided: tinyint}
      rows: |
        patient_id,encounter_id,location_id,code,group_id,name,diagnosed,nature,position,certainty,voided,date_inserted,date_updated,mspp_code
        11,1,7,6,0,Malaria,2026-01-02 09:00:00,diagnosis,primary,confirmed,0,2026-01-02 09:05:00,2026-01-02 09:05:00,11106
        12,2,7,6,0,Fever,2026-01-03 09:00:00,reason,,,0,2026-01-03 09:05:00,2026-01-03 09:05:00,11106
    consolidated_db.person_openmrs:
      format: csv
      columns: {mspp_code: varchar(10), voided: int}
      rows: |
        person_id,mspp_code,uuid,voided
        11,11106,fe5cae86-52a1-4713-b39d-4c05a9da3abf,0
        12,11106,a1b2c3d4-52a1-4713-b39d-4c05a9da3abf,0
    consolidated_db.concept:
      format: csv
      columns: {concept_id: int}
      rows: |
        concept_id,uuid
        6,116128AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    consolidated_db.concept_name:
      format: csv
      columns: {concept_id: int, locale_preferred: int, voided: int}
      rows: |
        concept_name_id,concept_id,name,locale_preferred,concept_name_type,voided
        1,6,Malaria,1,FULLY_SPECIFIED,0
  outputs:
    query:
      # only the diagnosis row: a nature='reason' row is why the patient attended, an
      # Encounter.reasonCode, not a condition the patient has
      partial: true
      rows:
        - {mspp_code: '11106', patient_id: 11, patient_fhir_id: fe5cae86-52a1-4713-b39d-4c05a9da3abf}
